# ====================================================================
# meihua 梅花易数插件配置
# ====================================================================

configs:
  - key: judge_prompt
    type: string
    label: 断卦提示词
    description: LLM 断卦使用的系统提示词（卦象文本会作为用户消息一并发送）
    default: "你擅长各种玄学占卜，请使用梅花易数详细分析下求卦者的现状、过程、结果以及可能会发生的状况，要求 200 字以内。直接输出纯文本，不要使用任何 Markdown 标记（不要 **、#、`、列表符号等）。"
