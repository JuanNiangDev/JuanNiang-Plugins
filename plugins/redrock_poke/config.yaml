# ====================================================================
# redrock_poke 插件配置
# ====================================================================
# 每个配置项由 key / type / label / description / default 声明。
# type 支持三种：
#   bool   → Web 面板开关
#   string → Web 面板单行输入框
#   list   → Web 面板可增删的多项输入框
# value 为用户当前生效值（缺省时回退 default）。插件通过
# jn.config.get("key") / jn.config.all() 读取。
# ====================================================================

configs:
  - key: enabled
    type: bool
    label: 启用戳一戳回复
    description: 是否在被戳时自动回复（默认 true）
    default: true

  - key: bot_qq
    type: string
    label: 机器人QQ号
    description: 仅当戳一戳的目标是本QQ时才回复；留空则自动通过 get_login_info 获取（一般无需手动填写）
    default: ""

  - key: poke_replies
    type: list
    label: 戳一戳回复语
    description: 被戳时随机选用的一条回复语（留空则使用内置默认回复库）
    default: []

  - key: emoji_folders
    type: list
    label: 表情包图床目录列表
    description: 一个或多个图床虚拟文件夹名（如 表情包、艺术创作）；留空则不使用目录池。需要 image 权限
    default:
      - 表情包

  - key: emoji_images
    type: list
    label: 单独指定的表情包图片
    description: 跨目录额外指定单张图片（按图片展示名称匹配），与目录池合并随机。可配置多个
    default: []

  - key: emoji_files
    type: list
    label: 目录内文件名白名单
    description: 仅针对上方目录池过滤；非空时仅保留符合该白名单的图片，留空则使用目录内全部图片
    default: []

  - key: emoji_rate
    type: string
    label: 表情包频率（%）
    description: 文本回复时附带一张表情包的概率，0~100；0 表示文本回复永不带图
    default: "30"

  - key: emoji_weight
    type: string
    label: 表情包回复权重
    description: 表情包回复 vs 文本回复的权重比（如 1:2 表示约 1/3 概率只发表情包）
    default: "1"

  - key: text_weight
    type: string
    label: 文本回复权重
    description: 与表情包回复权重对应；权重均为 0 时回退纯文本
    default: "2"
