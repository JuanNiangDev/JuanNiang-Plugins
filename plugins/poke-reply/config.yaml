# ====================================================================
# poke-reply 插件配置
# ====================================================================
# 每个配置项由 key / type / label / description / default 声明。
# type 支持三种：
#   bool   → Web 面板开关
#   string → Web 面板单行输入框
#   list   → Web 面板可增删的多项输入框
# value 为用户当前生效值（缺省时回退 default）。插件通过
# jn.config.get("key") / jn.config.all() 读取。
# ====================================================================

configs:
  - key: replies
    type: list
    label: 回复语列表
    description: 被戳时随机挑选的回复语（留空使用内置默认回复）
    default:
      - "别戳了别戳了！(〃＞＿＜;〃)"
      - "戳我干嘛！"
      - "再戳我要生气了！(#`Д´)ﾉ"
      - "戳一戳已收到，已读不回。"
      - "你戳我一下，我回你一下 🤏"

  - key: mention_sender
    type: bool
    label: "@发起者"
    description: 回复时是否 @ 发起戳一戳的人
    default: true

  - key: enable_poke_reply
    type: bool
    label: 启用戳一戳回复
    description: 是否启用本插件的戳一戳自动回复
    default: true