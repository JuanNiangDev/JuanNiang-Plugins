# ====================================================================
# redrock_delicious 插件配置
# ====================================================================
# 每个配置项由 key / type / label / description / default 声明。
# type 支持三种：
#   bool   → Web 面板开关
#   string → Web 面板单行输入框
#   list   → Web 面板可增删的多项输入框
# value 为用户当前生效值（缺省时回退 default）。插件通过
# jn.config.get("key") / jn.config.all() 读取。
# ====================================================================

configs:
  - key: extra_quotes
    type: list
    label: 自定义语录
    description: 追加到随机语录库末尾的自定义吃饭语录（留空只用内置语录）
    default: []
