# ====================================================================
# redrock_fanzha 插件配置
# ====================================================================
# 每个配置项由 key / type / label / description / default 声明。
# type 支持三种：
#   bool   → Web 面板开关
#   string → Web 面板单行输入框
#   list   → Web 面板可增删的多项输入框
# value 为用户当前生效值（缺省时回退 default）。插件通过
# jn.config.get("key") / jn.config.all() 读取。
# ====================================================================

configs:
  - key: enabled
    type: bool
    label: 启用反诈提醒
    description: 是否启用 /反诈提醒 命令
    default: true
  - key: image_file
    type: string
    label: 示意图文件名
    description: 骗局示意图文件名（插件目录内，支持相对路径）
    default: "anticheat.jpg"
  - key: at_all_senders
    type: list
    label: 全体反诈提醒发送人
    description: 可触发 /全体反诈提醒 的 QQ 号列表（留空则仅系统管理员可触发）
    default: []
  - key: rate_limit_enabled
    type: bool
    label: 启用限流
    description: 同一会话（群/私聊）在限流时间内最多发送一条反诈提醒
    default: true
  - key: rate_limit_minutes
    type: string
    label: 限流时间（分钟）
    description: 两次反诈提醒的最小间隔（分钟）
    default: "30"
