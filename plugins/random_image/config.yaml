# ====================================================================
# random_image 随机图片插件配置
# ====================================================================

configs:
  - key: default_folder
    type: string
    label: 默认图床目录
    description: "/随机图片 不带分类时使用的图床虚拟文件夹（如 艺术创作）"
    default: "艺术创作"

  - key: mappings
    type: list
    label: 分类与随机命令映射
    description: "每项格式「别名=目录」或「别名=目录1,目录2」（逗号分隔多个目录，全池合并随机）；同一别名写多行会合并。加载时为每个别名注册 /随机<别名> 命令（如 奶娃=表情包,艺术创作 → /随机奶娃 从两个目录随机）；/随机图片 <别名> 同样生效。分类也可直接写图床目录名。修改后需重载插件生效"
    default:
      - "奶龙=艺术创作"
      - "奶蛙=艺术创作"
      - "奶娃=表情包,艺术创作"
      - "表情包=表情包"
