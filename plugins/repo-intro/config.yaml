# ====================================================================
# repo-intro 插件配置
# ====================================================================
# 每个配置项由 key / type / label / description / default 声明。
# type 支持三种：
#   bool   → Web 面板开关
#   string → Web 面板单行输入框
#   list   → Web 面板可增删的多项输入框
# value 为用户当前生效值（缺省时回退 default）。插件通过
# jn.config.get("key") / jn.config.all() 读取。
# 数字类配置用 string 类型，插件内 tonumber 读取。
# ====================================================================

configs:
  - key: enable_github
    type: bool
    label: 启用 GitHub 仓库介绍
    description: 发送 GitHub 仓库链接时自动整理并发布仓库信息
    default: true

  - key: enable_huggingface
    type: bool
    label: 启用 Hugging Face 介绍
    description: 发送 Hugging Face 模型/数据集链接时自动整理并发布
    default: true

  - key: enable_modelscope
    type: bool
    label: 启用 ModelScope 介绍
    description: 发送 ModelScope 模型/数据集链接时自动整理并发布
    default: true

  - key: hf_mirror
    type: bool
    label: Hugging Face 走镜像站
    description: 元数据与 README 请求走 hf-mirror.com（国内 huggingface.co 直连常不通）；关闭则直连 huggingface.co
    default: true

  - key: enable_summary
    type: bool
    label: 启用 LLM 总结
    description: 用主程序 LLM 翻译描述并总结 README；关闭则只发仓库名与原文简介
    default: true

  - key: use_context_text
    type: bool
    label: 附带文本参与总结
    description: 消息中除仓库链接外的说明文字（如推文、推荐语）一并交给 LLM 作为仓库补充信息；LLM 会自动忽略与仓库无关的闲聊噪声。关闭则只用 README 与元数据
    default: true

  - key: reply_quote
    type: bool
    label: 引用原消息
    description: 回复时是否自动引用触发的那条消息
    default: true

  - key: group_only
    type: bool
    label: 仅群聊生效
    description: 开启后只在群聊中处理，私聊忽略
    default: false

  - key: cache_ttl
    type: string
    label: 结果缓存时长（秒）
    description: 同一仓库的介绍结果缓存秒数，默认 604800（7 天）
    default: "604800"

  - key: max_readme_chars
    type: string
    label: README 最大输入字数
    description: 送入 LLM 的 README 最大字符数，默认 10000
    default: "10000"

  - key: llm_timeout
    type: string
    label: LLM 超时（秒）
    description: 调用主程序 LLM 的超时秒数，默认 60
    default: "60"

  - key: max_repos
    type: string
    label: 单条消息最多处理链接数
    description: 一条消息里最多处理几个仓库链接，默认 5，超出忽略
    default: "5"

  - key: summary_min_chars
    type: string
    label: 总结最小字数
    description: LLM 总结的目标字数（默认 50）；内容稀少时允许如实写短或留空，避免为凑字数写套话
    default: "50"

  - key: summary_max_chars
    type: string
    label: 总结最大字数
    description: LLM 总结的最多字数，默认 150
    default: "150"

  - key: card_enabled
    type: bool
    label: 发送仓库卡片图
    description: 每个仓库段末尾附带 HTML 模板渲染的卡片图（走主程序 T2I 服务）；关闭则只发文本
    default: true

  - key: card_template
    type: string
    label: 卡片模板编号
    description: 仅用于 GitHub 卡片：templates/ 下 card-N（N=1~5）；random 在 1~5 间随机选一个；HF/MS 模型卡固定用 card-6；默认 5
    default: "5"

  - key: card_width
    type: string
    label: 卡片渲染宽度
    description: 渲染视口宽度像素（卡片尺寸），默认 900
    default: "900"

  - key: card_height
    type: string
    label: 卡片渲染高度
    description: 渲染视口高度像素（卡片尺寸），默认 450
    default: "450"

  - key: github_token
    type: string
    label: GitHub API Token（可选）
    description: 填写 GitHub Personal Access Token 后，GitHub API 限流从 60 次/小时提升至 5000 次/小时，并可访问私有仓库；留空使用匿名免费层级（60 次/小时）
    default: ""
