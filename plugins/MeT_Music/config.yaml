# ====================================================================
# MeT_Music 插件配置
# ====================================================================
# 每个配置项由 key / type / label / description / default 声明。
# type 支持三种：
#   bool   → Web 面板开关
#   string → Web 面板单行输入框
#   list   → Web 面板可增删的多项输入框
# value 为用户当前生效值（缺省时回退 default）。插件通过
# jn.config.get("key") / jn.config.all() 读取。
# ====================================================================

configs:
  - key: base_url
    type: string
    label: MeT Music API 地址
    description: 搜索与取流的 API 根地址（不含末尾斜杠）
    default: "https://music.met6.top:444"
