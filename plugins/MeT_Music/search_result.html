<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 560px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #1f2233 0%, #2a2140 55%, #1c2b3a 100%);
    color: #eef0f6;
    padding: 22px 20px 18px;
  }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .logo {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #7c5cff, #38b6ff);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .title { font-size: 19px; font-weight: 700; letter-spacing: 1px; }
  .keywords {
    font-size: 13px; color: #9aa3c0; margin: 4px 0 14px 44px;
    max-width: 480px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .song {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
  }
  .idx {
    width: 34px; height: 34px; flex: 0 0 34px; border-radius: 10px;
    background: linear-gradient(135deg, #7c5cff, #38b6ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 800; color: #fff;
  }
  .cover {
    width: 56px; height: 56px; flex: 0 0 56px; border-radius: 8px;
    object-fit: cover; background: rgba(255,255,255,0.10);
  }
  .info { flex: 1 1 auto; min-width: 0; }
  .name {
    font-size: 15px; font-weight: 700; color: #f4f5fa;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub {
    font-size: 12px; color: #9aa3c0; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .right { flex: 0 0 auto; text-align: right; }
  .dur { font-size: 12px; color: #9aa3c0; }
  .vip {
    display: inline-block; margin-top: 6px; padding: 1px 6px;
    font-size: 10px; border-radius: 6px; color: #ffd76a;
    border: 1px solid rgba(255, 215, 106, 0.55);
  }
  .free {
    display: inline-block; margin-top: 6px; padding: 1px 6px;
    font-size: 10px; border-radius: 6px; color: #7ce6a5;
    border: 1px solid rgba(124, 230, 165, 0.5);
  }
  .footer {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px dashed rgba(255,255,255,0.14);
    font-size: 12px; color: #8f98b8; text-align: center;
  }
  .footer b { color: #b9c1e0; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">🎵</div>
    <div class="title">MeT Music 搜索结果</div>
  </div>
  <div class="keywords">关键词：__KEYWORDS__</div>
  __ROWS__
  <div class="footer">回复 <b>/music play &lt;编号&gt;</b> 播放对应歌曲 · MeT Music</div>
</body>
</html>
