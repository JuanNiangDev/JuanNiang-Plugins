# ====================================================================
# redrock_faq 插件配置
# ====================================================================
# 每个配置项由 key / type / label / description / default 声明。
# type 支持三种：
#   bool   → Web 面板开关
#   string → Web 面板单行输入框
#   list   → Web 面板可增删的多项输入框
# value 为用户当前生效值（缺省时回退 default）。插件通过
# jn.config.get("key") / jn.config.all() 读取。
# ====================================================================

configs:
  - key: bot_name
    type: string
    label: 卷娘称呼
    description: 群聊中 @ 该称呼触发回复（私聊菜单与 @ 匹配使用）
    default: "卷娘"

  - key: enable_chat_rules
    type: bool
    label: 启用语料库
    description: 是否启用卷娘日常语料库（"在吗""emo"等闲聊关键词）回复
    default: true