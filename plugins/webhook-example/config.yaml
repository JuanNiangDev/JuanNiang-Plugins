# ====================================================================
# webhook-example 插件配置
# ====================================================================
# 每个配置项由 key / type / label / description / default 声明。
# type 支持三种：
#   bool   → Web 面板开关
#   string → Web 面板单行输入框
#   list   → Web 面板可增删的多项输入框
# value 为用户当前生效值（缺省时回退 default）。插件通过
# jn.config.get("key") / jn.config.all() 读取。
# ====================================================================

configs:
  - key: default_group
    type: string
    label: 默认通知群号
    description: 当推送 payload 未指定 group_id 时，通知转发的默认群号
    default: "123456789"