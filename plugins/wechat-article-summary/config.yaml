# ====================================================================
# wechat-article-summary 插件配置
# ====================================================================
# 每个配置项由 key / type / label / description / default 声明。
# type 支持三种：
#   bool   → Web 面板开关
#   string → Web 面板单行输入框
#   list   → Web 面板可增删的多项输入框
# value 为用户当前生效值（缺省时回退 default）。插件通过
# jn.config.get("key") / jn.config.all() 读取。
# 数字类配置用 string 类型，插件内 tonumber 读取。
# ====================================================================

configs:
  - key: enabled
    type: bool
    label: 启用公众号文章总结
    description: 发送 mp.weixin.qq.com 文章链接时自动抓取并总结；关闭则完全不处理
    default: true

  - key: enable_summary
    type: bool
    label: 启用 LLM 总结
    description: 用主程序 LLM 按文章类型总结核心内容；关闭则只发标题与公众号名
    default: true

  - key: reply_quote
    type: bool
    label: 引用原消息
    description: 回复时是否自动引用触发的那条消息
    default: true

  - key: send_cover
    type: bool
    label: 发送文章图片
    description: 普通文章只发封面（og:image）；cgiDataNew 图文形态发送全部正文图片；关闭则都不发
    default: true

  - key: group_only
    type: bool
    label: 仅群聊生效
    description: 开启后只在群聊中处理，私聊忽略
    default: false

  - key: cache_ttl
    type: string
    label: 结果缓存时长（秒）
    description: 同一篇文章的总结结果缓存秒数，默认 604800（7 天）
    default: "604800"

  - key: max_content_chars
    type: string
    label: 正文最大输入字数
    description: 送入 LLM 的文章正文最大字符数，默认 10000
    default: "10000"

  - key: llm_timeout
    type: string
    label: LLM 超时（秒）
    description: 调用主程序 LLM 的超时秒数，默认 60
    default: "60"

  - key: max_articles
    type: string
    label: 单条消息最多处理链接数
    description: 一条消息里最多处理几篇文章链接，默认 5，超出忽略
    default: "5"

  - key: ua
    type: string
    label: 抓取 User-Agent
    description: 抓取文章页使用的浏览器 UA（微信对默认 UA 风控，勿改回非浏览器 UA）
    default: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

  - key: summary_min_chars
    type: string
    label: 总结最小字数
    description: LLM 总结的最少字数，默认 50
    default: "50"

  - key: summary_max_chars
    type: string
    label: 总结最大字数
    description: LLM 总结的最多字数，默认 200
    default: "200"

  - key: batch_window
    type: string
    label: 攒批窗口（秒）
    description: 同一人首条公众号链接起算的等待秒数，窗口内收到的新链接继续并入同一批；0 = 不攒批立即发送
    default: "60"

  - key: batch_threshold
    type: string
    label: 攒批阈值（条）
    description: 窗口内攒满这么多条链接立即发送；同时是「合并转发」的门槛，条数 ≥ 该值才合并转发，否则每篇一条普通消息
    default: "3"

  - key: single_window
    type: string
    label: 单篇等待（秒）
    description: 只有 1 篇链接时的等待秒数，期间来第 2 篇会自动延长到攒批窗口；默认 10
    default: "10"

  - key: merge_forward
    type: bool
    label: 合并转发投递（总开关）
    description: 开启后，一批链接数量 ≥ 攒批阈值（默认 3）才合并成一条转发；不足阈值或关闭本开关时，每篇发一条普通消息（文本 + 封面）
    default: true

  - key: forward_sender_name
    type: string
    label: 转发节点昵称
    description: 合并转发内各节点展示的昵称；留空则用机器人自己的昵称
    default: ""
