# ====================================================================
# redrock_caidanci 插件配置
# ====================================================================
# 每个配置项由 key / type / label / description / default 声明。
# type 支持三种：
#   bool   → Web 面板开关
#   string → Web 面板单行输入框
#   list   → Web 面板可增删的多项输入框
# value 为用户当前生效值（缺省时回退 default）。插件通过
# jn.config.get("key") / jn.config.all() 读取。
# ====================================================================

configs:
  - key: default_length
    type: string
    label: 默认单词长度
    description: 开局时默认的单词长度（支持 4、5、6，默认 5）
    default: "5"

  - key: max_attempts
    type: string
    label: 最大猜测次数
    description: 每局最多可猜测的次数（默认 6）
    default: "6"

  - key: enable_trigger
    type: bool
    label: 引导触发
    description: 是否启用"没意思/有啥好玩"等关键词引导开局
    default: true