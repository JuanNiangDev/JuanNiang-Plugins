# ====================================================================
# redrock_group_manager 插件配置
# ====================================================================
# 每个配置项由 key / type / label / description / default 声明。
# type 支持三种：
#   bool   → Web 面板开关
#   string → Web 面板单行输入框
#   list   → Web 面板可增删的多项输入框
# value 为用户当前生效值（缺省时回退 default）。插件通过
# jn.config.get("key") / jn.config.all() 读取。
# ====================================================================

configs:
  - key: img_spam_window
    type: string
    label: 图片刷屏时间窗口(秒)
    description: 在该秒数内发送超过阈值的图片才会被判为刷屏（默认 2）
    default: "2"

  - key: img_spam_threshold
    type: string
    label: 图片刷屏阈值
    description: 时间窗口内触发警告的图片数量（默认 3）
    default: "3"

  - key: img_mute_duration
    type: string
    label: 刷屏禁言时长(秒)
    description: 重复刷屏被禁言的时长（默认 60）
    default: "60"

  - key: copy_threshold
    type: string
    label: 复读触发阈值
    description: 多少人连续发送相同消息判定为复读（默认 3）
    default: "3"

  - key: enable_copy_check
    type: bool
    label: 启用复读检测
    description: 是否启用 +1 复读检测
    default: true

  - key: violation_mute_seconds
    type: string
    label: 违规禁言时长(秒)
    description: 第二次违规时禁言时长，默认 1800（30 分钟）
    default: "1800"

  - key: llm_review_enabled
    type: bool
    label: 关键词AI审查
    description: 命中关键词后送 LLM 复核（敏感/黑名单高危词带倾向提示防误触，灰色词常规审查）；关闭则敏感/黑名单词直接处罚、灰色词直接放行
    default: true

  - key: exempt_users
    type: list
    label: 白名单 QQ 列表
    description: 加入白名单的 QQ 号不参与任何违规检测（/白名单 可添加，面板可增删）
    default: []

  - key: admin_users
    type: list
    label: 手动管理员 QQ 列表
    description: 群角色无法识别时手动指定的管理员账号（面板可增删）
    default: []

  - key: violations
    type: list
    label: 违规记录(群号:QQ:次数)
    description: 违规人及违规等级，格式 群号:QQ号:次数；删除某行即重置该用户违规
    default: []