# ====================================================================
# redrock_quiz 插件配置
# ====================================================================
# 每个配置项由 key / type / label / description / default 声明。
# type 支持三种：
#   bool   → Web 面板开关
#   string → Web 面板单行输入框
#   list   → Web 面板可增删的多项输入框
# value 为用户当前生效值（缺省时回退 default）。插件通过
# jn.config.get("key") / jn.config.all() 读取。
# ====================================================================

configs:
  - key: enabled
    type: bool
    label: 启用插件
    description: 是否启用红岩快问快答小游戏
    default: true

  - key: max_wrong
    type: string
    label: 最多答错次数
    description: 每局最多允许答错的次数，超过则该局结束
    default: "4"

  - key: questions_per_game
    type: string
    label: 每局题数
    description: 每局抽取的题目数量
    default: "5"